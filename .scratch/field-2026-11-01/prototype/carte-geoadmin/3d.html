<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>PROTOTYPE jetable — terrain 3D swisstopo (Cesium)</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<script src="https://cesium.com/downloads/cesiumjs/releases/1.130/Build/Cesium/Cesium.js"></script>
<link href="https://cesium.com/downloads/cesiumjs/releases/1.130/Build/Cesium/Widgets/widgets.css" rel="stylesheet" />
<style>
  html, body, #cesium { margin: 0; height: 100%; width: 100%; font: 13px/1.4 system-ui, sans-serif; }
  #panel { position: absolute; top: 8px; left: 8px; width: 320px; background: #fffdf5; border: 1px solid #c9b; padding: 10px; box-shadow: 0 2px 8px #0003; }
  .proto { background: #c00; color: #fff; padding: 1px 6px; border-radius: 3px; font-weight: 700; }
  label { display: block; margin: 4px 0; }
  input, select { width: 100%; }
  #state { white-space: pre-wrap; font: 11px/1.3 ui-monospace, monospace; background: #f3f0e8; padding: 6px; }
  a { color: #06c; }
</style>
</head>
<body>
<div id="cesium"></div>
<div id="panel">
  <h1 style="font-size:14px;margin:0 0 6px"><span class="proto">PROTOTYPE</span> terrain 3D · <a href="index.html" id="to2d">← carte 2D</a></h1>
  <label>Imagerie drapée
    <select id="imagery">
      <option value="ch.swisstopo.swissimage|jpeg">ch.swisstopo.swissimage</option>
      <option value="ch.swisstopo.pixelkarte-farbe|jpeg">ch.swisstopo.pixelkarte-farbe</option>
      <option value="ch.swisstopo.landeskarte-farbe-10|png">ch.swisstopo.landeskarte-farbe-10</option>
    </select>
  </label>
  <label>Flèche illustrative au milieu (m) — parabole, PAS la chaînette du moteur <input type="number" id="sag" value="12" min="0" step="1" /></label>
  <label><input type="checkbox" id="buildings" /> Bâtiments 3D Tiles (ch.swisstopo.swissbuildings3d.3d)</label>
  <p style="margin:6px 0">A et B viennent du hash d'URL (partagé avec la carte 2D). Molette = zoom, clic-droit/ctrl = inclinaison.</p>
  <div id="state">chargement…</div>
  <p style="font-size:11px;color:#555;margin:6px 0 0">© swisstopo — terrain quantized-mesh 3d.geo.admin.ch, imagerie WMTS. Tout est tuilé : aucun affichage sans réseau.</p>
</div>
<script type="module">
const p = new URLSearchParams(location.hash.slice(1));
const A = (p.get('a') || '6.525529496858815,46.844504482603654').split(',').map(Number);
const B = (p.get('b') || '6.5205811331508245,46.84607607354039').split(',').map(Number);
document.getElementById('to2d').href = 'index.html' + location.hash;
const stateEl = document.getElementById('state');
const log = (o) => (stateEl.textContent = JSON.stringify(o, null, 1));

// Pas de jeton Ion : tous les fournisseurs sont swisstopo.
Cesium.Ion.defaultAccessToken = undefined;
const TERRAIN = 'https://3d.geo.admin.ch/ch.swisstopo.terrain.3d/v1/20250101/';

function imagery(sel) {
  const [layer, ext] = sel.split('|');
  return new Cesium.UrlTemplateImageryProvider({
    url: `https://wmts.geo.admin.ch/1.0.0/${layer}/default/current/3857/{z}/{x}/{y}.${ext}`,
    tilingScheme: new Cesium.WebMercatorTilingScheme(), maximumLevel: 19, credit: '© swisstopo',
  });
}

const t0 = performance.now();
let terrainProvider;
try { terrainProvider = await Cesium.CesiumTerrainProvider.fromUrl(TERRAIN); }
catch (e) { log({ erreur_terrain: String(e) }); throw e; }

const viewer = new Cesium.Viewer('cesium', {
  terrainProvider, baseLayer: new Cesium.ImageryLayer(imagery(document.getElementById('imagery').value)),
  geocoder: false, baseLayerPicker: false, sceneModePicker: false, animation: false, timeline: false, homeButton: false,
  navigationHelpButton: false, infoBox: false, selectionIndicator: false,
});
viewer.scene.globe.depthTestAgainstTerrain = true;

document.getElementById('imagery').onchange = (e) => { viewer.imageryLayers.removeAll(); viewer.imageryLayers.addImageryProvider(imagery(e.target.value)); };

let buildingsTileset;
document.getElementById('buildings').onchange = async (e) => {
  if (e.target.checked && !buildingsTileset) {
    buildingsTileset = await Cesium.Cesium3DTileset.fromUrl('https://3d.geo.admin.ch/ch.swisstopo.swissbuildings3d.3d/v1/tileset.json').catch((err) => { log({ erreur_batiments: String(err) }); return null; });
    if (buildingsTileset) viewer.scene.primitives.add(buildingsTileset);
  } else if (buildingsTileset) buildingsTileset.show = e.target.checked;
};

// hauteurs des ancrages depuis le terrain swisstopo, puis ligne avec flèche illustrative
const carto = [Cesium.Cartographic.fromDegrees(A[0], A[1]), Cesium.Cartographic.fromDegrees(B[0], B[1])];
await Cesium.sampleTerrainMostDetailed(terrainProvider, carto);
const zA = carto[0].height, zB = carto[1].height;
const geod = new Cesium.EllipsoidGeodesic(carto[0], carto[1]);
const span = geod.surfaceDistance;

let lineEntity;
function drawLine() {
  const sag = Number(document.getElementById('sag').value) || 0, anchorH = 2; // 2 m au-dessus du sol : illustratif
  const pts = [];
  for (let i = 0; i <= 60; i++) {
    const t = i / 60, c = geod.interpolateUsingFraction(t);
    const z = (zA + anchorH) * (1 - t) + (zB + anchorH) * t - 4 * sag * t * (1 - t);
    pts.push(Cesium.Cartesian3.fromRadians(c.longitude, c.latitude, z));
  }
  if (lineEntity) viewer.entities.remove(lineEntity);
  lineEntity = viewer.entities.add({ polyline: { positions: pts, width: 4, material: Cesium.Color.ORANGE } });
}
viewer.entities.add({ position: Cesium.Cartesian3.fromDegrees(A[0], A[1], zA + 2), point: { pixelSize: 12, color: Cesium.Color.RED }, label: { text: 'A', pixelOffset: new Cesium.Cartesian2(0, -18), font: '14px sans-serif' } });
viewer.entities.add({ position: Cesium.Cartesian3.fromDegrees(B[0], B[1], zB + 2), point: { pixelSize: 12, color: Cesium.Color.GREEN }, label: { text: 'B', pixelOffset: new Cesium.Cartesian2(0, -18), font: '14px sans-serif' } });
drawLine();
document.getElementById('sag').oninput = drawLine;

// caméra : cadre les entités (A, B, ligne), vue oblique depuis le côté
await viewer.zoomTo(viewer.entities, new Cesium.HeadingPitchRange(geod.startHeading + Math.PI / 2, Cesium.Math.toRadians(-30), span * 2.4));

log({ terrain: TERRAIN, pret_ms: Math.round(performance.now() - t0), A: { lon: A[0], lat: A[1], z_terrain: +zA.toFixed(1) }, B: { lon: B[0], lat: B[1], z_terrain: +zB.toFixed(1) }, portee_m: +span.toFixed(1), note: 'altitudes = terrain quantized-mesh swisstopo, pas profile.json' });
</script>
</body>
</html>
